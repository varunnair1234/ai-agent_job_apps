  must_match_any: ["software", "machine learning", "ml", "ai", "robotics", "data"]
  exclude_keywords: ["senior", "staff", "principal", "manager", "phd"]
  max_applications_per_company: 3

# Companies to watch. ats = greenhouse | lever | ashby, token = the board slug in the careers URL.
companies:
  - { name: Figma, ats: greenhouse, token: figma }
  - { name: Cloudflare, ats: greenhouse, token: cloudflare }
  - { name: Palantir, ats: lever, token: palantir }
